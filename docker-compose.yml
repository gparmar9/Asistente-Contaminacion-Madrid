# Base de datos PostgreSQL del proyecto (calidad del aire de Madrid).
#
# Los datos se guardan en un VOLUMEN NOMBRADO (postgres_data), no dentro del
# contenedor: así el contenedor se puede parar, actualizar o recrear sin perder
# la base de datos. Las credenciales se leen de .env (no versionado en git).
#
# Uso:
#   docker compose up -d      # levantar la base de datos
#   docker compose down       # parar (los datos siguen en el volumen)
#   docker compose down -v    # parar Y BORRAR los datos (cuidado)

services:
  db:
    image: postgres:18
    container_name: jupiter_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # En postgres:18+ el punto de montaje recomendado es /var/lib/postgresql
      # (los datos van a un subdirectorio por versión; montar .../data da error).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
