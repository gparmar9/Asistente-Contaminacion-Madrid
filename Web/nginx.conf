# nginx del contenedor `web`: sirve el build de Vite en / y hace de reverse proxy
# de /api/* hacia el contenedor `api` (ApiUsuario, uvicorn en :8000) por la red
# interna de Docker. Un solo origen: el frontend nunca conoce el host de la API.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión de los estáticos y del JSON de la API
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # --- /api/chat: una respuesta del asistente puede tardar ~120 s (bucle de
    # agente + LLM). El proxy_read_timeout por defecto de nginx es 60 s y
    # cortaría la respuesta a medias con un 504. Esta location gana a /api/
    # por ser el prefijo más largo.
    location /api/chat {
        proxy_pass http://api:8000/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # --- Resto de la API: la barra final en proxy_pass quita el prefijo /api
    #     (/api/estaciones -> http://api:8000/estaciones)
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # --- Estáticos con hash en el nombre: caché larga e inmutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- SPA: las rutas del router (/estaciones/8, /asistente...) devuelven
    #     index.html, que nunca se cachea para que un despliegue se vea al instante.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
