# nginx sirve la web en / y actúa como proxy hacia api-usuario:8000 y phoenix:6006.
# El navegador accede a los tres servicios desde un único origen.

# Log JSON para filtrar por campo en CloudWatch.
# `uri` conserva la ruta original y los parámetros de consulta.
log_format json escape=json '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"uri":"$request_uri",'
    '"status":$status,'
    '"bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_response_time":"$upstream_response_time"'
'}';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    access_log /var/log/nginx/access.log json;

    # DNS de Docker con caché de 10 s y destinos en variables: permite cambios de IP
    # y arrancar sin Phoenix (en ese caso, /phoenix devuelve 502).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_usuario http://api-usuario:8000;
    set $phoenix http://phoenix:6006;

    # Compresión de los estáticos y del JSON de la API
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # --- /api/chat: una respuesta del asistente puede tardar ~120 s (bucle de
    # agente + LLM). El proxy_read_timeout por defecto de nginx es 60 s y
    # cortaría la respuesta a medias con un 504. Esta location gana a /api/
    # por ser el prefijo más largo.
    location /api/chat {
        # proxy_pass usa una variable: rewrite elimina /api y conserva los parámetros.
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_usuario;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # --- Resto de la API: /api/estaciones -> http://api-usuario:8000/estaciones
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_usuario;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # --- Phoenix: PHOENIX_HOST_ROOT_PATH=/phoenix añade el prefijo a los enlaces;
    #     el proxy lo elimina de las peticiones al backend.
    #     La redirección relativa conserva el puerto externo.
    location = /phoenix {
        absolute_redirect off;
        return 301 /phoenix/;
    }

    location /phoenix/ {
        # Acceso abierto en local; en EC2, contraseña de la web o 403 si no hay contraseña.
        # Se incluye antes del rewrite para ejecutar primero el posible return 403.
        include /etc/nginx/phoenix-acceso.conf;
        rewrite ^/phoenix/(.*)$ /$1 break;
        proxy_pass $phoenix;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        # GraphQL usa HTTP multipart: sin buffer y con timeout amplio para las suscripciones.
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    # --- Estáticos con hash en el nombre: caché larga e inmutable
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # --- SPA: las rutas del router (/estaciones/8, /asistente...) devuelven
    #     index.html, que nunca se cachea para que un despliegue se vea al instante.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
