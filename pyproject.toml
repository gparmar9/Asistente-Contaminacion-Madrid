# Empaquetado mínimo de los módulos de servicio (src/rag y src/prediccion) para que sean
# importables como `rag` y `prediccion` desde la raíz, desde ApiUsuario y desde las pruebas.
#
#   pip install -e .                 # instala los paquetes en modo editable
#   pip install -r requirements-rag.txt         # deps del RAG + los paquetes
#   pip install -r requirements-prediccion.txt  # deps de la predicción + los paquetes
#
# Los scripts de src/etl no forman parte del paquete: se ejecutan como hasta ahora
# (`prediccion` los añade a sys.path, igual que hacen las pruebas y los notebooks).

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asistente-contaminacion-rag"
version = "0.1.0"
description = "RAG documental del asistente de calidad del aire de Madrid"
requires-python = ">=3.11"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["rag", "prediccion"]

[tool.pytest.ini_options]
# `src` en el path hace que `import rag` funcione en pytest aunque no se haya
# instalado el paquete (p. ej. en el job de CI que solo instala PyYAML).
pythonpath = ["src"]
testpaths = ["tests"]
