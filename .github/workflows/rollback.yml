# Vuelta atrás de una pieza del proyecto a una versión anterior.
#
# Se lanza a mano: Actions → "Rollback" → Run workflow, eligiendo el componente en el desplegable.
#   - Sin versión: modo consulta. Muestra las versiones publicadas y cuál está activa, y no cambia nada.
#   - Con versión y motivo: vuelve a esa versión sin reconstruir nada, deja constancia y lo verifica.
#
# No hay "volver a la anterior" automático a propósito: después de un rollback, la versión
# anterior es justo la que estaba mal. Primero se consulta y luego se elige.
#
# Componentes:
#   lambda       versión = número de versión de la función. Apunta la función a la imagen de esa
#                versión (por digest) y publica una versión nueva con el motivo.
#   api-usuario  versión = commit corto de la imagen (p. ej. 3b27c7c). Cambia la versión activa en
#   orquestador  SSM (con el motivo en el historial del parámetro) y, si la EC2 está encendida,
#   rag          actualiza solo ese contenedor. La imagen ya está en ECR: no se reconstruye nada.
# Para añadir uno nuevo: sumarlo a `options` y a un job con `if:`.
#
# Usa el mismo rol OIDC que desplegar.yml y comparte su bloqueo por componente: nunca coinciden
# un despliegue y un rollback de la misma pieza.
name: ⏮️ Rollback
run-name: Rollback ${{ inputs.componente }} · ${{ inputs.version != '' && format('a la versión {0}', inputs.version) || 'consulta' }}

on:
  workflow_dispatch:
    inputs:
      componente:
        description: "Qué pieza volver atrás"
        type: choice
        required: true
        default: lambda
        options:
          - lambda
          - api-usuario
          - orquestador
          - rag
      version:
        description: "Versión a la que volver: número (lambda) o commit corto (resto). Vacío = solo consultar"
        required: false
        default: ""
      motivo:
        description: "Motivo del rollback (obligatorio si indicas versión)"
        required: false
        default: ""

permissions:
  contents: read
  id-token: write   # permite pedir el token OIDC que AWS cambia por credenciales temporales

concurrency:
  group: despliegue-${{ inputs.componente }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  lambda:
    name: Lambda · consultar versiones o volver atrás
    if: inputs.componente == 'lambda'
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: jupiter-pipeline
      FUNCTION_NAME: jupiter-pipeline
    steps:
      # Las entradas llegan por variables de entorno y no interpoladas en el script, para que un
      # motivo con comillas o $(...) no se ejecute como código.
      - name: Validar la entrada
        env:
          VERSION: ${{ inputs.version }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          if [ -n "$VERSION" ]; then
            [[ "$VERSION" =~ ^[0-9]+$ ]] || { echo "::error::La versión debe ser un número (p. ej. 1), no '$VERSION'."; exit 1; }
            [ -n "${MOTIVO// }" ] || { echo "::error::Indica el motivo del rollback."; exit 1; }
          fi

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jupiter-github-actions-deploy
          role-session-name: rollback-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Versiones publicadas
        run: |
          ACTUAL=$(aws lambda get-function-configuration --function-name "$FUNCTION_NAME" \
            --query CodeSha256 --output text)
          echo "ACTUAL=$ACTUAL" >> "$GITHUB_ENV"
          aws lambda list-versions-by-function --function-name "$FUNCTION_NAME" \
            --query "Versions[?Version!='\$LATEST'].{v:Version,fecha:LastModified,sha:CodeSha256,desc:Description}" \
            --output json | jq 'sort_by(.v | tonumber) | reverse' > versiones.json

          # Versión activa: la más reciente publicada con la imagen que ejecuta la función.
          VIVA=$(jq -r --arg a "$ACTUAL" 'map(select(.sha == $a) | .v | tonumber) | max // empty' versiones.json)
          DESC_VIVA=$(jq -r --arg v "$VIVA" '.[] | select(.v == $v) | .desc' versiones.json)
          # Sugerencia: la versión más reciente anterior a la activa y con otra imagen.
          SUGERIDA=$(jq -r --arg a "$ACTUAL" --argjson viva "${VIVA:-0}" \
            'map(select(.sha != $a and (.v | tonumber) < $viva)) | first | .v // empty' versiones.json)

          {
            echo "### Versiones de \`$FUNCTION_NAME\`"
            echo
            echo "| Versión | Fecha (UTC) | Imagen | Descripción | |"
            echo "|---|---|---|---|---|"
            jq -r --arg a "$ACTUAL" --arg viva "$VIVA" '.[] | "| \(.v) | \(.fecha[0:16] | sub("T"; " ")) | `\(.sha[0:12])` | \(if .desc == "" then "—" else .desc end) | \(if .v == $viva then "**en producción**" elif .sha == $a then "misma imagen" else "" end) |"' versiones.json
            echo
            if [ -z "$VIVA" ]; then
              echo "La imagen activa no coincide con ninguna versión publicada: revisa la función antes de volver atrás."
            elif [[ "$DESC_VIVA" == rollback* ]]; then
              echo "La versión activa ($VIVA) ya es un rollback: la anterior es justo la que se deshizo. Elige en la tabla."
            elif [ -n "$SUGERIDA" ]; then
              echo "Versión anterior a la activa: **$SUGERIDA**. Comprueba en la tabla que es la que quieres."
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Modo consulta
        if: inputs.version == ''
        run: |
          echo "No se ha cambiado nada. Para volver atrás, relanza el workflow indicando versión y motivo." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      # La imagen se referencia por digest: aunque ya no tenga tag en ECR, es exactamente la misma.
      - name: Volver a la versión elegida
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          MOTIVO: ${{ inputs.motivo }}
          REGISTRO: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
        run: |
          DESTINO=$(jq -r --arg v "$VERSION" '.[] | select(.v == $v) | .sha' versiones.json)
          [ -n "$DESTINO" ] || { echo "::error::La versión $VERSION no existe. Consulta la tabla del paso anterior."; exit 1; }
          if [ "$DESTINO" = "$ACTUAL" ]; then
            echo "::error::La función ya ejecuta la imagen de la versión $VERSION: no hay nada que deshacer."
            exit 1
          fi
          echo "DESTINO=$DESTINO" >> "$GITHUB_ENV"

          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --image-uri "$REGISTRO/$ECR_REPOSITORY@sha256:$DESTINO" --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"

          # --code-sha256: solo publica si la función tiene exactamente la imagen elegida.
          DESCRIPCION="rollback a v$VERSION: $MOTIVO (@$GITHUB_ACTOR)"
          NUEVA=$(aws lambda publish-version --function-name "$FUNCTION_NAME" \
            --code-sha256 "$DESTINO" --description "${DESCRIPCION:0:256}" --query Version --output text)
          echo "NUEVA=$NUEVA" >> "$GITHUB_ENV"

      - name: Verificar que la Lambda ejecuta la imagen elegida
        if: inputs.version != ''
        run: |
          read -r ESTADO SHA_LAMBDA < <(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query "[LastUpdateStatus, CodeSha256]" --output text)
          echo "Estado de la actualización: $ESTADO"
          echo "Imagen elegida:             $DESTINO"
          echo "CodeSha256 de la Lambda:    $SHA_LAMBDA"
          if [ "$ESTADO" != "Successful" ] || [ "$SHA_LAMBDA" != "$DESTINO" ]; then
            echo "::error::La Lambda no ejecuta la imagen elegida."
            exit 1
          fi

      - name: Resumen
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          {
            echo
            echo "### Rollback hecho"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Vuelta a la versión | $VERSION (imagen \`${DESTINO:0:12}\`) |"
            echo "| Imagen que se retira | \`${ACTUAL:0:12}\` |"
            echo "| Versión publicada con el rollback | $NUEVA |"
            echo "| Motivo | $MOTIVO |"
            echo "| Lanzado por | @$GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Servicios de la API que corren en la EC2: la "versión" es el tag de la imagen (commit corto).
  contenedor:
    name: ${{ inputs.componente }} · consultar versiones o volver atrás
    if: inputs.componente != 'lambda'
    runs-on: ubuntu-latest
    env:
      COMPONENTE: ${{ inputs.componente }}
      ECR_REPOSITORY: jupiter-${{ inputs.componente }}
      PARAM: /jupiter/versiones/${{ inputs.componente }}
      BUCKET: jupiter-calidad-aire-madrid
    steps:
      - name: Validar la entrada
        env:
          VERSION: ${{ inputs.version }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          if [ -n "$VERSION" ]; then
            [[ "$VERSION" =~ ^[0-9a-f]{7}$ ]] || { echo "::error::La versión es el commit corto de la imagen (7 caracteres, p. ej. 3b27c7c), no '$VERSION'."; exit 1; }
            [ -n "${MOTIVO// }" ] || { echo "::error::Indica el motivo del rollback."; exit 1; }
          fi

      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jupiter-github-actions-deploy
          role-session-name: rollback-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Versiones disponibles
        run: |
          ACTIVA=$(aws ssm get-parameter --name "$PARAM" --query Parameter.Value --output text 2> /dev/null || echo "")
          echo "ACTIVA=$ACTIVA" >> "$GITHUB_ENV"
          aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
            --query "imageDetails[?imageTags].{tags:imageTags,fecha:imagePushedAt,bytes:imageSizeInBytes}" \
            --output json > imagenes.json
          aws ssm get-parameter-history --name "$PARAM" \
            --query "Parameters[].{v:Value,fecha:LastModifiedDate,desc:Description}" \
            --output json > historial.json 2> /dev/null || echo "[]" > historial.json
          {
            echo "### Imágenes de \`$ECR_REPOSITORY\`"
            echo
            echo "| Versión | Subida | Tamaño | |"
            echo "|---|---|---|---|"
            jq -r --arg a "$ACTIVA" 'sort_by(.fecha) | reverse | .[] | "| `\(.tags | join(", "))` | \(.fecha[0:16] | sub("T"; " ")) | \(.bytes / 1048576 | floor) MB | \(if (.tags | index($a)) then "**activa**" else "" end) |"' imagenes.json
            echo
            echo "### Últimos cambios de versión activa"
            echo
            echo "| Fecha | Versión | Quién y por qué |"
            echo "|---|---|---|"
            jq -r 'reverse | .[:8][] | "| \(.fecha[0:16] | sub("T"; " ")) | `\(.v)` | \(.desc // "—") |"' historial.json
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Modo consulta
        if: inputs.version == ''
        run: |
          echo "No se ha cambiado nada. Para volver atrás, relanza el workflow indicando versión y motivo." \
            | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Volver a la versión elegida
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          if ! aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids imageTag="$VERSION" > /dev/null 2>&1; then
            echo "::error::La imagen $ECR_REPOSITORY:$VERSION no existe en ECR. Consulta la tabla del paso anterior."
            exit 1
          fi
          if [ "$VERSION" = "$ACTIVA" ]; then
            echo "::error::La versión activa ya es $VERSION: no hay nada que deshacer."
            exit 1
          fi
          DESCRIPCION="rollback a $VERSION: $MOTIVO (@$GITHUB_ACTOR)"
          aws ssm put-parameter --name "$PARAM" --type String --overwrite --value "$VERSION" \
            --description "${DESCRIPCION:0:1024}" --query Version --output text

          EC2=$(bash .github/scripts/ec2.sh instancia)   # si la consulta falla, el paso falla
          read -r INSTANCIA ESTADO <<< "$EC2"
          if [ "${ESTADO:-}" != "running" ]; then
            echo "EC2_RESULTADO=EC2 ${ESTADO:-inexistente}: usará esta versión al encenderse" >> "$GITHUB_ENV"
            exit 0
          fi
          bash .github/scripts/ec2.sh ejecutar \
            "aws s3 cp s3://$BUCKET/ec2/arrancar.sh /opt/jupiter/arrancar.sh --region $AWS_REGION --only-show-errors && chmod 700 /opt/jupiter/arrancar.sh && /opt/jupiter/arrancar.sh $COMPONENTE"
          echo "EC2_RESULTADO=actualizado y sano en $INSTANCIA" >> "$GITHUB_ENV"

      - name: Resumen
        if: inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
          MOTIVO: ${{ inputs.motivo }}
        run: |
          {
            echo
            echo "### Rollback hecho"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Vuelta a la versión | \`$VERSION\` |"
            echo "| Versión que se retira | \`${ACTIVA:-—}\` |"
            echo "| EC2 | $EC2_RESULTADO |"
            echo "| Motivo | $MOTIVO |"
            echo "| Lanzado por | @$GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"
