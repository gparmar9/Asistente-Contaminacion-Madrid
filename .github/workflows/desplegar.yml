# Despliegue de cualquier pieza del proyecto desde GitHub Actions.
#
# Se lanza a mano: pestaña Actions → "Desplegar" → Run workflow, eligiendo:
#   - la rama en "Use workflow from" (lo normal es main): se despliega el código de esa rama;
#   - el componente en el desplegable.
# Para volver a una versión anterior: rollback.yml.
#
# Componentes:
#   lambda       tests → build → push a ECR (tag = SHA del commit) → update-function-code
#                → versión publicada con descripción → verificación del digest.
#   web          tests → build → push a ECR (tag = SHA del commit) → ficheros de arranque a S3
#   api-usuario  → versión activa en SSM (/jupiter/versiones/<componente>) → si la EC2 está
#   agente       encendida, actualiza solo ese contenedor por SSM Run Command y espera a que
#   rag          esté sano. Si está apagada, usará esta versión al encenderse.
#   prediccion
#   phoenix      usa la imagen pública fijada en deploy/ec2/compose.yml, sin tests ni build.
#                Sube los ficheros de arranque a S3 y actualiza Phoenix si la EC2 está encendida.
# Para añadir uno nuevo: sumarlo a `options` y a un job con `if:` (y lo mismo en rollback.yml).
#
# Autenticación por OIDC: GitHub entrega un token firmado y AWS lo cambia por credenciales
# temporales del rol jupiter-github-actions-deploy (deploy/iam/*-github-actions.json). No hay
# claves de AWS en el repositorio. El único secreto es AWS_ACCOUNT_ID, para que el ID de la
# cuenta no aparezca en los logs, que son públicos.
name: 🚀 Desplegar
run-name: Desplegar ${{ inputs.componente }} desde ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      componente:
        description: "Qué desplegar"
        type: choice
        required: true
        default: lambda
        options:
          - lambda
          - web
          - api-usuario
          - agente
          - rag
          - prediccion
          - phoenix

permissions:
  contents: read
  id-token: write   # permite pedir el token OIDC que AWS cambia por credenciales temporales

# Nunca dos despliegues (o un despliegue y un rollback) del mismo componente a la vez: el segundo
# espera. Componentes distintos sí pueden desplegarse en paralelo.
concurrency:
  group: despliegue-${{ inputs.componente }}
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1

jobs:
  # Tests unitarios y de integración con PostgreSQL. Se omiten para la imagen pública de Phoenix.
  tests:
    if: inputs.componente != 'phoenix'
    uses: ./.github/workflows/tests.yml

  lambda:
    name: Lambda · build, push y despliegue
    needs: tests
    if: inputs.componente == 'lambda'
    runs-on: ubuntu-latest
    env:
      ECR_REPOSITORY: jupiter-pipeline
      FUNCTION_NAME: jupiter-pipeline
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Avisar si no se despliega desde main
        if: github.ref_name != 'main'
        run: echo "::warning::Se está desplegando la rama '${GITHUB_REF_NAME}', no main. La Lambda de producción ejecutará este código."

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jupiter-github-actions-deploy
          role-session-name: despliegue-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # --provenance/--sbom=false: sin ellos la imagen se sube como lista de manifiestos, que
      # Lambda no sabe leer. --platform: la función está creada como x86_64.
      - name: Build de la imagen
        env:
          IMAGEN: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "IMAGEN=$IMAGEN" >> "$GITHUB_ENV"
          docker build --provenance=false --sbom=false --platform linux/amd64 \
            -f deploy/Dockerfile.lambda -t "$IMAGEN:$TAG" -t "$IMAGEN:latest" .

      - name: Push a ECR
        run: |
          docker push "$IMAGEN:$TAG"
          docker push "$IMAGEN:latest"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGEN:$TAG" | cut -d@ -f2)
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      # Subir la imagen no basta: la función sigue con la copia anterior hasta este paso.
      # La versión se publica aparte para darle una descripción que rollback.yml muestra en su
      # tabla; --code-sha256 impide publicar si la función no tiene la imagen recién subida.
      - name: Actualizar la función Lambda
        run: |
          aws lambda update-function-code --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGEN:$TAG" --query LastUpdateStatus --output text
          aws lambda wait function-updated --function-name "$FUNCTION_NAME"
          VERSION=$(aws lambda publish-version --function-name "$FUNCTION_NAME" \
            --code-sha256 "${DIGEST#sha256:}" \
            --description "deploy $TAG desde $GITHUB_REF_NAME (@$GITHUB_ACTOR)" \
            --query Version --output text)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Verificar que la Lambda ejecuta la imagen nueva
        run: |
          read -r ESTADO SHA_LAMBDA < <(aws lambda get-function-configuration \
            --function-name "$FUNCTION_NAME" \
            --query "[LastUpdateStatus, CodeSha256]" --output text)
          echo "Estado de la actualización: $ESTADO"
          echo "Digest subido a ECR:        ${DIGEST#sha256:}"
          echo "CodeSha256 de la Lambda:    $SHA_LAMBDA"
          if [ "$ESTADO" != "Successful" ] || [ "$SHA_LAMBDA" != "${DIGEST#sha256:}" ]; then
            echo "::error::La Lambda no ejecuta la imagen recién subida."
            exit 1
          fi

      - name: Resumen
        run: |
          {
            echo "### Lambda \`$FUNCTION_NAME\` desplegada"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Componente | lambda |"
            echo "| Rama | \`$GITHUB_REF_NAME\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Tag en ECR | \`$TAG\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Versión de la función | $VERSION |"
            echo "| Lanzado por | @$GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Servicios de la API que corren en la EC2 (deploy/ec2/compose.yml).
  contenedor:
    name: ${{ inputs.componente }} · build, push y despliegue en la EC2
    needs: tests
    if: inputs.componente != 'lambda' && inputs.componente != 'phoenix'
    runs-on: ubuntu-latest
    env:
      COMPONENTE: ${{ inputs.componente }}
      BUCKET: jupiter-calidad-aire-madrid
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Avisar si no se despliega desde main
        if: github.ref_name != 'main'
        run: echo "::warning::Se está desplegando la rama '${GITHUB_REF_NAME}', no main. La EC2 ejecutará este código."

      # Dónde está el Dockerfile de cada servicio y a qué repositorio de ECR va.
      - name: Datos del componente
        run: |
          case "$COMPONENTE" in
            web)         CONTEXTO=Web        DOCKERFILE=Web/Dockerfile        ;;
            api-usuario) CONTEXTO=ApiUsuario DOCKERFILE=ApiUsuario/Dockerfile ;;
            agente)      CONTEXTO=Agente     DOCKERFILE=Agente/Dockerfile     ;;
            rag)         CONTEXTO=.          DOCKERFILE=deploy/Dockerfile.rag ;;
            prediccion)  CONTEXTO=.          DOCKERFILE=deploy/Dockerfile.prediccion ;;
            *) echo "::error::Componente desconocido: $COMPONENTE"; exit 1 ;;
          esac
          {
            echo "CONTEXTO=$CONTEXTO"
            echo "DOCKERFILE=$DOCKERFILE"
            echo "ECR_REPOSITORY=jupiter-$COMPONENTE"
            echo "TAG=${GITHUB_SHA::7}"
          } >> "$GITHUB_ENV"

      # La imagen del RAG (torch + modelo) ocupa ~3 GB y el build necesita varias veces eso: se
      # borran del runner herramientas preinstaladas que no se usan (.NET, Android, Haskell).
      - name: Liberar disco del runner
        if: inputs.componente == 'rag'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jupiter-github-actions-deploy
          role-session-name: despliegue-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Login en ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Solo la imagen del RAG usa COMMIT: queda en los metadatos de su índice (GET /salud).
      - name: Build de la imagen
        env:
          IMAGEN: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}
        run: |
          echo "IMAGEN=$IMAGEN" >> "$GITHUB_ENV"
          ARGS=()
          [ "$COMPONENTE" = rag ] && ARGS=(--build-arg "COMMIT=$TAG")
          docker build --provenance=false --sbom=false --platform linux/amd64 "${ARGS[@]}" \
            -f "$DOCKERFILE" -t "$IMAGEN:$TAG" "$CONTEXTO"

      - name: Push a ECR
        run: |
          docker push "$IMAGEN:$TAG"
          DIGEST=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGEN:$TAG" | cut -d@ -f2)
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      # compose.yml, arrancar.sh... salen del mismo commit que la imagen: la EC2 los descarga de S3.
      - name: Publicar los ficheros de arranque en S3
        run: aws s3 cp deploy/ec2/ "s3://$BUCKET/ec2/" --recursive --only-show-errors

      # El historial del parámetro guarda cada cambio con su descripción: quién, qué y desde dónde.
      - name: Registrar la versión activa en SSM
        run: |
          PARAM="/jupiter/versiones/$COMPONENTE"
          ANTERIOR=$(aws ssm get-parameter --name "$PARAM" --query Parameter.Value --output text 2> /dev/null || echo "—")
          echo "ANTERIOR=$ANTERIOR" >> "$GITHUB_ENV"
          aws ssm put-parameter --name "$PARAM" --type String --overwrite --value "$TAG" \
            --description "deploy $TAG desde $GITHUB_REF_NAME (@$GITHUB_ACTOR)" --query Version --output text

      # Con la EC2 apagada no hay nada más que hacer: arrancar.sh leerá esta versión al encenderla.
      - name: Actualizar el contenedor en la EC2
        run: |
          EC2=$(bash .github/scripts/ec2.sh instancia)   # si la consulta falla, el paso falla
          read -r INSTANCIA ESTADO <<< "$EC2"
          if [ "${ESTADO:-}" != "running" ]; then
            echo "EC2_RESULTADO=EC2 ${ESTADO:-inexistente}: usará esta versión al encenderse" >> "$GITHUB_ENV"
            echo "La EC2 no está encendida (${ESTADO:-no existe}): no se actualiza ahora."
            exit 0
          fi
          bash .github/scripts/ec2.sh ejecutar \
            "aws s3 cp s3://$BUCKET/ec2/arrancar.sh /opt/jupiter/arrancar.sh --region $AWS_REGION --only-show-errors && chmod 700 /opt/jupiter/arrancar.sh && /opt/jupiter/arrancar.sh $COMPONENTE"
          echo "EC2_RESULTADO=actualizado y sano en $INSTANCIA" >> "$GITHUB_ENV"

      - name: Resumen
        run: |
          {
            echo "### \`$COMPONENTE\` desplegado"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Rama | \`$GITHUB_REF_NAME\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Imagen | \`$ECR_REPOSITORY:$TAG\` |"
            echo "| Digest | \`$DIGEST\` |"
            echo "| Versión anterior | \`$ANTERIOR\` |"
            echo "| EC2 | $EC2_RESULTADO |"
            echo "| Lanzado por | @$GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Phoenix usa una imagen de Docker Hub: publicamos los ficheros de arranque y actualizamos
  # el contenedor. Para volver atrás, revertir el commit y desplegar de nuevo.
  phoenix:
    name: phoenix · despliegue en la EC2
    if: inputs.componente == 'phoenix'
    runs-on: ubuntu-latest
    env:
      BUCKET: jupiter-calidad-aire-madrid
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Avisar si no se despliega desde main
        if: github.ref_name != 'main'
        run: echo "::warning::Se está desplegando la rama '${GITHUB_REF_NAME}', no main. La EC2 usará su compose.yml."

      - name: Versión de la imagen
        run: |
          IMAGEN=$(grep -oE 'arizephoenix/phoenix:[^[:space:]]+' deploy/ec2/compose.yml) \
            || { echo "::error::No se encuentra la imagen de Phoenix en deploy/ec2/compose.yml"; exit 1; }
          echo "IMAGEN=$IMAGEN" >> "$GITHUB_ENV"

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jupiter-github-actions-deploy
          role-session-name: despliegue-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Publicar los ficheros de arranque en S3
        run: aws s3 cp deploy/ec2/ "s3://$BUCKET/ec2/" --recursive --only-show-errors

      # Si la EC2 está apagada, arrancar.sh aplicará el cambio al encenderla.
      - name: Actualizar el contenedor en la EC2
        run: |
          EC2=$(bash .github/scripts/ec2.sh instancia)   # si la consulta falla, el paso falla
          read -r INSTANCIA ESTADO <<< "$EC2"
          if [ "${ESTADO:-}" != "running" ]; then
            echo "EC2_RESULTADO=EC2 ${ESTADO:-inexistente}: arrancará esta versión al encenderse" >> "$GITHUB_ENV"
            echo "La EC2 no está encendida (${ESTADO:-no existe}): no se actualiza ahora."
            exit 0
          fi
          bash .github/scripts/ec2.sh ejecutar \
            "aws s3 cp s3://$BUCKET/ec2/arrancar.sh /opt/jupiter/arrancar.sh --region $AWS_REGION --only-show-errors && chmod 700 /opt/jupiter/arrancar.sh && /opt/jupiter/arrancar.sh phoenix"
          echo "EC2_RESULTADO=actualizado y sano en $INSTANCIA" >> "$GITHUB_ENV"

      - name: Resumen
        run: |
          {
            echo "### \`phoenix\` desplegado"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Rama | \`$GITHUB_REF_NAME\` |"
            echo "| Commit | \`$GITHUB_SHA\` |"
            echo "| Imagen | \`$IMAGEN\` |"
            echo "| EC2 | $EC2_RESULTADO |"
            echo "| Lanzado por | @$GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"
