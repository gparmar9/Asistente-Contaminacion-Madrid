# Enciende el entorno del proyecto en AWS para trabajar o hacer una demo: la base de datos
# (RDS jupiter-postgres) y el servidor de la API (EC2 con tag Name=jupiter-api), si existe.
#
# Se lanza a mano: Actions → "Encender entorno" → Run workflow. Si algo ya está encendido, lo
# deja como está. Al terminar, el resumen muestra la dirección de la API (la IP cambia en cada
# encendido).
#
# Para apagar la EC2 al terminar: "Apagar entorno". Si nadie lo hace, la programación nocturna
# la apaga a la 01:30 (hora de Madrid). La base de datos se queda siempre encendida (la Lambda
# carga al cierre de cada franja); si la encuentra parada, la enciende.
#
# Rol propio (jupiter-github-actions-entorno), separado del de despliegue: solo puede encender y
# apagar estas dos máquinas y comprobar el estado de la API en la EC2.
name: ▶️ Encender entorno

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # permite pedir el token OIDC que AWS cambia por credenciales temporales

concurrency:
  group: entorno
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  DB_INSTANCE: jupiter-postgres

jobs:
  encender:
    name: Encender la base de datos y la EC2
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jupiter-github-actions-entorno
          role-session-name: encender-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      # Estados posibles: stopped, starting, available, stopping y otros transitorios
      # (backing-up, modifying...). Solo se pide arrancar si está parada; la espera va después,
      # para que la RDS y la EC2 arranquen a la vez.
      - name: Pedir el encendido de la RDS
        run: |
          estado() {
            aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE" \
              --query "DBInstances[0].DBInstanceStatus" --output text
          }
          ESTADO=$(estado)
          echo "Estado inicial: $ESTADO"
          echo "RDS_INICIAL=$ESTADO" >> "$GITHUB_ENV"

          # A medio apagar no se puede arrancar: hay que esperar a que termine de pararse.
          while [ "$ESTADO" = "stopping" ]; do
            sleep 20
            ESTADO=$(estado)
          done

          if [ "$ESTADO" = "stopped" ]; then
            # Si otra cosa la arranca justo entre la consulta y esta llamada, AWS da error;
            # se acepta mientras el estado resultante sea "arrancando" o "disponible".
            if ! aws rds start-db-instance --db-instance-identifier "$DB_INSTANCE" \
                 --query "DBInstance.DBInstanceStatus" --output text; then
              ESTADO=$(estado)
              case "$ESTADO" in
                starting|available) echo "Ya se estaba encendiendo por otra vía." ;;
                *) echo "::error::No se pudo encender la base de datos (estado: $ESTADO)."; exit 1 ;;
              esac
            fi
          elif [ "$ESTADO" = "available" ]; then
            echo "Ya estaba encendida."
          else
            echo "Estado '$ESTADO': se esperará a que quede disponible."
          fi

      - name: Encender la EC2
        run: |
          EC2=$(bash .github/scripts/ec2.sh instancia)   # si la consulta falla, el paso falla
          read -r INSTANCIA ESTADO <<< "$EC2"
          echo "EC2_INICIAL=${ESTADO:-no existe}" >> "$GITHUB_ENV"
          if [ -z "${INSTANCIA:-}" ]; then
            echo "No hay ninguna EC2 con Name=jupiter-api: se enciende solo la base de datos."
            exit 0
          fi
          echo "INSTANCIA=$INSTANCIA" >> "$GITHUB_ENV"
          if [ "$ESTADO" = "stopping" ]; then
            aws ec2 wait instance-stopped --instance-ids "$INSTANCIA"
            ESTADO=stopped
          fi
          if [ "$ESTADO" = "stopped" ]; then
            aws ec2 start-instances --instance-ids "$INSTANCIA" \
              --query "StartingInstances[0].CurrentState.Name" --output text
          fi
          aws ec2 wait instance-running --instance-ids "$INSTANCIA"
          IP=$(aws ec2 describe-instances --instance-ids "$INSTANCIA" \
                 --query "Reservations[0].Instances[0].PublicIpAddress" --output text)
          echo "IP=$IP" >> "$GITHUB_ENV"
          echo "EC2 encendida: $INSTANCIA ($IP)"

      # Espera hasta 30 min (60 consultas cada 30 s). Arrancar suele tardar unos minutos.
      - name: Esperar a la base de datos
        run: aws rds wait db-instance-available --db-instance-identifier "$DB_INSTANCE"

      # jupiter.service ejecuta arrancar.sh en cada encendido; termina en "active" cuando los
      # contenedores pasan su healthcheck, o en "failed" si algo va mal.
      - name: Esperar a que la API esté lista
        if: env.INSTANCIA != ''
        run: |
          bash .github/scripts/ec2.sh ejecutar \
            "timeout 900 bash -c 'until systemctl is-active -q jupiter.service || systemctl is-failed -q jupiter.service; do sleep 5; done'; if systemctl is-active -q jupiter.service; then docker compose --env-file /opt/jupiter/versiones.env -f /opt/jupiter/compose.yml ps; else echo 'jupiter.service no arrancó. Últimas líneas de su log:'; journalctl -u jupiter.service -n 40 --no-pager; exit 1; fi"

      - name: Resumen
        run: |
          {
            echo "### Entorno encendido"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Base de datos | \`$DB_INSTANCE\` (estaba: $RDS_INICIAL) |"
            echo "| Servidor de la API | ${INSTANCIA:-no existe} (estaba: $EC2_INICIAL) |"
            if [ -n "${IP:-}" ]; then
              echo "| Web | http://$IP (solo desde las IP autorizadas) |"
            fi
            echo "| Apagado automático de la EC2 | 01:30 (hora de Madrid) |"
            echo "| Lanzado por | @$GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"
