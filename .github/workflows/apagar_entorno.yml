# Apaga el entorno del proyecto en AWS al terminar de trabajar o de hacer una demo: primero el
# servidor de la API (EC2 con tag Name=jupiter-api), si existe, y después la base de datos.
#
# Se lanza a mano: Actions → "Apagar entorno" → Run workflow. Es opcional: la programación
# nocturna lo apaga igualmente a la 01:30 (hora de Madrid). Lo que ya esté apagado se deja así.
#
# Entre las 22:00 y las 00:00 (hora de Madrid) apaga la EC2 pero NO la base de datos: la
# programación la enciende a las 22:00 para la carga de las 23:45, que fallaría con ella parada.
name: ⏹️ Apagar entorno

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # permite pedir el token OIDC que AWS cambia por credenciales temporales

# Mismo grupo que "Encender entorno": nunca se encienden y apagan a la vez.
concurrency:
  group: entorno
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  DB_INSTANCE: jupiter-postgres

jobs:
  apagar:
    name: Apagar la EC2 y la base de datos
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Comprobar si es la hora de la carga nocturna
        run: |
          AHORA=$(TZ=Europe/Madrid date +%H%M)
          echo "Hora de Madrid: ${AHORA:0:2}:${AHORA:2:2}"
          if [ "$AHORA" -ge 2200 ]; then
            echo "::warning::Entre las 22:00 y las 00:00 la base de datos tiene que seguir encendida para la carga de las 23:45: se apaga solo la EC2. La base de datos se apagará sola a la 01:30."
            echo "APAGAR_RDS=no" >> "$GITHUB_ENV"
          else
            echo "APAGAR_RDS=si" >> "$GITHUB_ENV"
          fi

      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/jupiter-github-actions-entorno
          role-session-name: apagar-${{ github.run_id }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: true

      - name: Apagar la EC2
        run: |
          EC2=$(bash .github/scripts/ec2.sh instancia)   # si la consulta falla, el paso falla
          read -r INSTANCIA ESTADO <<< "$EC2"
          echo "EC2_INICIAL=${ESTADO:-no existe}" >> "$GITHUB_ENV"
          if [ -z "${INSTANCIA:-}" ]; then
            echo "No hay ninguna EC2 con Name=jupiter-api."
            exit 0
          fi
          if [ "$ESTADO" = "pending" ] || [ "$ESTADO" = "running" ]; then
            aws ec2 stop-instances --instance-ids "$INSTANCIA" \
              --query "StoppingInstances[0].CurrentState.Name" --output text
          fi
          aws ec2 wait instance-stopped --instance-ids "$INSTANCIA"
          echo "EC2 apagada: $INSTANCIA"

      # Estados posibles: available, stopping, stopped, starting y otros transitorios
      # (backing-up, modifying...). Solo se puede apagar desde "available".
      - name: Apagar la RDS
        if: env.APAGAR_RDS == 'si'
        run: |
          estado() {
            aws rds describe-db-instances --db-instance-identifier "$DB_INSTANCE" \
              --query "DBInstances[0].DBInstanceStatus" --output text
          }
          ESTADO=$(estado)
          echo "Estado inicial: $ESTADO"
          echo "RDS_INICIAL=$ESTADO" >> "$GITHUB_ENV"

          if [ "$ESTADO" = "stopped" ]; then
            echo "Ya estaba apagada: no hay nada que hacer."
            exit 0
          fi

          if [ "$ESTADO" != "stopping" ]; then
            if [ "$ESTADO" != "available" ]; then
              echo "Estado '$ESTADO': se espera a que quede disponible para poder apagarla."
              aws rds wait db-instance-available --db-instance-identifier "$DB_INSTANCE"
            fi
            # Si otra cosa la apaga justo entre la consulta y esta llamada, AWS da error;
            # se acepta mientras el estado resultante sea "apagándose" o "apagada".
            if ! aws rds stop-db-instance --db-instance-identifier "$DB_INSTANCE" \
                 --query "DBInstance.DBInstanceStatus" --output text; then
              ESTADO=$(estado)
              case "$ESTADO" in
                stopping|stopped) echo "Ya se estaba apagando por otra vía." ;;
                *) echo "::error::No se pudo apagar la base de datos (estado: $ESTADO)."; exit 1 ;;
              esac
            fi
          fi

          # Espera hasta 30 min (60 consultas cada 30 s). Apagar suele tardar unos minutos.
          for _ in $(seq 60); do
            ESTADO=$(estado)
            [ "$ESTADO" = "stopped" ] && break
            sleep 30
          done
          echo "Estado final: $ESTADO"
          [ "$ESTADO" = "stopped" ] || { echo "::error::Tras 30 min sigue en '$ESTADO'."; exit 1; }

      - name: Resumen
        run: |
          {
            echo "### Entorno apagado"
            echo
            echo "| | |"
            echo "|---|---|"
            if [ "$EC2_INICIAL" = "no existe" ]; then
              echo "| Servidor de la API | no existe |"
            else
              echo "| Servidor de la API | estaba: $EC2_INICIAL → apagado |"
            fi
            if [ "$APAGAR_RDS" = si ]; then
              echo "| Base de datos | \`$DB_INSTANCE\` (estaba: ${RDS_INICIAL:-—}) → apagada |"
            else
              echo "| Base de datos | sigue encendida para la carga de las 23:45; se apaga a la 01:30 |"
            fi
            echo "| Próximo encendido automático de la base de datos | 22:00 (hora de Madrid) |"
            echo "| Lanzado por | @$GITHUB_ACTOR |"
          } >> "$GITHUB_STEP_SUMMARY"
