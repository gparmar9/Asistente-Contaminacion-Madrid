name: Tests

on:
  # push solo en las ramas largas: en una rama feature con PR abierto, `push` y `pull_request`
  # ejecutarían los mismos jobs dos veces. Así un PR los corre una vez y, tras el merge, se
  # vuelven a correr sobre el resultado en development o main.
  push:
    branches: [main, development]
  pull_request:
  # Lo reutiliza desplegar.yml: no se despliega nada si los tests no pasan.
  workflow_call:

jobs:
  # Tests unitarios: lógica pura, sin base de datos. Rápidos y deterministas.
  unit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # fastapi + httpx (mismas versiones que requirements-rag.txt) y jsonschema permiten probar
      # la API del RAG y su esquema de salida. chromadb y sentence-transformers (PyTorch) no se
      # instalan: test_buscar y test_indexar se saltan solos con importorskip.
      # sqlalchemy fijado a la misma versión que requirements.txt: una versión más nueva sin fijar
      # cambió el driver de PostgreSQL por defecto (psycopg2 → psycopg v3) y rompió el job de
      # integración (ver requirements.txt).
      - name: Instalar dependencias
        run: pip install pandas numpy scikit-learn sqlalchemy==2.0.49 requests python-dotenv pytest PyYAML fastapi==0.141.1 httpx==0.28.1 jsonschema

      - name: Ejecutar tests unitarios
        run: pytest tests/ -v --ignore=tests/test_integracion_db.py

  # Tests de integración: contra un PostgreSQL efímero levantado como servicio.
  integracion:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      # sqlalchemy y psycopg2-binary fijados a las mismas versiones que requirements.txt: sin
      # fijar, una SQLAlchemy más nueva elige el driver `psycopg` (v3) por defecto para
      # `postgresql://` y el job falla con "No module named 'psycopg'" al no estar instalado.
      - name: Instalar dependencias
        run: pip install pandas numpy scikit-learn sqlalchemy==2.0.49 psycopg2-binary==2.9.12 requests python-dotenv pytest

      - name: Ejecutar tests de integración
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          RUN_DB_TESTS: "1"
        run: pytest tests/test_integracion_db.py -v

  # Servicios de la API: cada uno con sus propias dependencias de test (requirements-dev.txt),
  # igual que se instalan en local. Sin base de datos externa (SQLite en memoria) ni red.
  api-usuario:
    name: Tests de ApiUsuario
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ApiUsuario
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: ApiUsuario/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar tests
        run: pytest tests -v

  # El LLM y el servicio RAG se sustituyen por dobles en los tests: sin red, sin claves y sin torch.
  orquestador:
    name: Tests del orquestador
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: LLMOrchestrator
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: LLMOrchestrator/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar tests
        run: pytest tests -v

  # El agente nuevo (Agente/): LLM falso con guion y RAG fingido con httpx.MockTransport.
  # Independiente del orquestador: sus propios requirements y su propio job.
  agente:
    name: Tests del agente
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Agente
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: Agente/requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar tests
        run: pytest tests -v
