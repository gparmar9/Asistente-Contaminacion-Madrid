# La aplicación en la EC2: los mismos servicios que el perfil "api" del docker-compose.yml de la
# raíz, pero con las imágenes de ECR (no se construye nada en la máquina), sin base de datos propia
# (usa RDS) y con el Agente en lugar del orquestador. Lo lanza arrancar.sh, que genera antes los
# ficheros que se leen aquí:
#   versiones.env       REGISTRO y VERSION_* (qué imagen de cada servicio está activa, desde SSM)
#   secretos-bd.env     DATABASE_URL de la API (desde SSM, cifrado)
#   config-agente.env   un VAR=valor por cada parámetro de /jupiter/agente/ en SSM (puede estar vacío)
#   web-acceso.conf     y web.htpasswd: usuario y contraseña de la web (vacíos si no hay)
#   phoenix-acceso.conf acceso a /phoenix/: la misma contraseña, o 403 si no hay
#
# Solo web expone el puerto 80: sirve la SPA y dirige /api/* a api-usuario y /phoenix/* a Phoenix.
# Los demás servicios quedan en la red interna de Docker, accesibles por nombre (http://rag:8010).
name: jupiter

x-logs: &logs
  # Sin límite, los logs de Docker crecen hasta llenar el disco.
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  rag:
    image: ${REGISTRO}/jupiter-rag:${VERSION_RAG}
    restart: unless-stopped
    <<: *logs

  # Bedrock con el rol de la máquina: sin claves. El modelo y el resto de su configuración
  # (LLM_MODELO, DATABASE_URL con el rol agente_lectura...) salen de config-agente.env. Sin
  # LLM_MODELO arranca igual y /responder devuelve 503.
  agente:
    image: ${REGISTRO}/jupiter-agente:${VERSION_AGENTE}
    restart: unless-stopped
    env_file:
      - config-agente.env
    environment:
      APP_ENV: produccion
      LLM_PROVEEDOR: bedrock
      AWS_REGION: eu-west-1
      RAG_URL: http://rag:8010
    depends_on:
      rag:
        condition: service_healthy
    <<: *logs

  api-usuario:
    image: ${REGISTRO}/jupiter-api-usuario:${VERSION_API_USUARIO}
    restart: unless-stopped
    env_file:
      - secretos-bd.env
    environment:
      APP_ENV: produccion
      AGENTE_URL: http://agente:8200
    depends_on:
      agente:
        condition: service_healthy
    <<: *logs

  web:
    image: ${REGISTRO}/jupiter-web:${VERSION_WEB}
    restart: unless-stopped
    depends_on:
      api-usuario:
        condition: service_healthy
    ports:
      - "80:80"
    # Contraseña opcional (ver arrancar.sh): nginx incluye conf.d/*.conf a nivel http, así que
    # web-acceso.conf se aplica a toda la web sin reconstruir la imagen. Vacío, no hace nada.
    volumes:
      - ./web-acceso.conf:/etc/nginx/conf.d/zz-acceso.conf:ro
      - ./web.htpasswd:/etc/nginx/web.htpasswd:ro
      # Exige contraseña en /phoenix/; devuelve 403 si no hay ninguna configurada.
      - ./phoenix-acceso.conf:/etc/nginx/phoenix-acceso.conf:ro
    <<: *logs

  # Trazas del agente. Para cambiar la imagen de Docker Hub, editar la versión y desplegar "phoenix".
  # /jupiter/agente/phoenix_endpoint activa el envío a http://phoenix:6006/v1/traces.
  # El agente puede arrancar sin Phoenix. Su interfaz se abre en /phoenix/ a través de web.
  phoenix:
    image: arizephoenix/phoenix:version-20.19.0
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /mnt/data   # SQLite de Phoenix, en el volumen
      PHOENIX_HOST_ROOT_PATH: /phoenix # los enlaces de la interfaz llevan el prefijo de nginx
      # Retención inicial de la base. Se purga los domingos a las 00:00 UTC si la EC2 está encendida.
      # Si está apagada, las trazas se acumulan; la alarma de disco vigila el espacio.
      PHOENIX_DEFAULT_RETENTION_POLICY_DAYS: "30"
    volumes:
      - phoenix_data:/mnt/data
    # La imagen no trae healthcheck ni curl/wget: se usa su Python.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:6006/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    <<: *logs

# En el disco EBS de la EC2: sobrevive a apagar y encender la máquina.
volumes:
  phoenix_data:
