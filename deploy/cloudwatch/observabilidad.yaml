# Observabilidad de la aplicación de la EC2 en CloudWatch (pila jupiter-observabilidad).
#
#   aws cloudformation deploy --template-file deploy/cloudwatch/observabilidad.yaml \
#       --stack-name jupiter-observabilidad \
#       --parameter-overrides InstanceId=<id de la EC2> [UmbralTokensDia=<tokens>]
#
# Grupo de logs, filtros de métricas sobre el log de acceso de nginx, alarmas y panel: todo lo de
# CloudWatch se crea, se revisa y se borra junto. Las métricas de negocio del pipeline
# (Jupiter/Pipeline) no se crean aquí: las publica la Lambda en formato EMF (deploy/metricas_emf.py). En una actualización, los parámetros que no se
# pasan conservan su valor anterior.
# El grupo lo crea esta plantilla y no Docker (awslogs-create-group sigue en false): si existiera
# antes, CloudFormation no podría crearlo y fallaría la pila.
# Capa gratuita: 9 métricas propias de 10 (3 filtros + 2 del agente de CloudWatch + 4 de la
# Lambda), 11 alarmas con las 2 de la Lambda creadas a mano (12 métricas en alarmas: la de Bedrock
# usa 2; las 2 que pasan de 10 se pagan) y 1 panel.
AWSTemplateFormatVersion: "2010-09-09"
Description: Jupiter - logs, alarmas y panel de la aplicacion

Parameters:
  InstanceId:
    Type: AWS::EC2::Instance::Id
    Description: EC2 jupiter-api (cambia si se recrea la máquina con 2_crear_ec2.ps1)
  UmbralTokensDia:
    Type: Number
    Default: 2000000
    Description: Tokens de entrada de Bedrock al día que disparan el aviso de coste (provisional; el pico medido es 1,23 M en una campaña de evaluación)

Resources:
  # web (log de acceso de nginx en JSON), api-usuario y rag; un stream por contenedor.
  # agente y phoenix no envían: lo del agente ya está en Phoenix.
  LogsEc2:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /jupiter/ec2
      RetentionInDays: 14   # como /aws/lambda/jupiter-pipeline

  # --- Filtros de métricas -------------------------------------------------------------------
  # Se aplican a todo el grupo, pero solo el log de web es JSON con status: las líneas de texto de
  # api-usuario y rag no casan. El healthcheck de web (GET / desde 127.0.0.1) responde 200 y no
  # entra en ninguno.
  FiltroPeticiones5xx:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogsEc2
      FilterPattern: '{ $.status >= 500 }'
      MetricTransformations:
        - MetricNamespace: Jupiter
          MetricName: Peticiones5xx
          MetricValue: "1"
          DefaultValue: 0
          Unit: Count

  # Sin 401: con el 80 abierto a internet y contraseña, los robots y el primer acceso de cada
  # navegador la piden constantemente y taparían los 4xx que indican un fallo (404, 405, 422...).
  FiltroPeticiones4xx:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogsEc2
      FilterPattern: '{ $.status >= 400 && $.status < 500 && $.status != 401 }'
      MetricTransformations:
        - MetricNamespace: Jupiter
          MetricName: Peticiones4xx
          MetricValue: "1"
          DefaultValue: 0
          Unit: Count

  # /api/chat y /api/chat/stream; en el streaming es el tiempo hasta el último evento.
  # Solo las 200: un 401 o un 503 inmediatos bajarían la media.
  FiltroTiempoRespuestaChat:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref LogsEc2
      FilterPattern: '{ $.uri = "/api/chat*" && $.status = 200 }'
      MetricTransformations:
        - MetricNamespace: Jupiter
          MetricName: TiempoRespuestaChat
          MetricValue: $.request_time
          Unit: Seconds

  # --- Alarmas -------------------------------------------------------------------------------
  # Todas avisan al tema SNS jupiter-alertas, como las de la Lambda. notBreaching: con la EC2 o
  # la RDS apagadas no hay datos y eso no es un fallo.
  AlarmaEc2Estado:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jupiter-ec2-status
      AlarmDescription: La EC2 falla sus comprobaciones de estado (máquina o sistema rotos)
      Namespace: AWS/EC2
      MetricName: StatusCheckFailed
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:jupiter-alertas"]

  # La EC2 está en modo unlimited: sin créditos no se frena, pero la CPU extra se paga aparte.
  AlarmaEc2CreditosCpu:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jupiter-ec2-creditos-cpu
      AlarmDescription: La EC2 se queda sin créditos de CPU; en modo unlimited empieza a pagar CPU extra
      Namespace: AWS/EC2
      MetricName: CPUCreditBalance
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 20
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:jupiter-alertas"]

  AlarmaEc2Memoria:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jupiter-ec2-memoria
      AlarmDescription: Memoria de la EC2 por encima del 90 % durante 10 minutos (cinco contenedores en 4 GB)
      Namespace: CWAgent
      MetricName: mem_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
      Statistic: Average
      Period: 300
      EvaluationPeriods: 2
      Threshold: 90
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:jupiter-alertas"]

  # El agente de CloudWatch publica el disco con path y fstype además de InstanceId; la raíz de
  # Amazon Linux 2023 es xfs.
  AlarmaEc2Disco:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jupiter-ec2-disco
      AlarmDescription: Disco de la EC2 por encima del 85 % (imágenes, logs locales y trazas de Phoenix)
      Namespace: CWAgent
      MetricName: disk_used_percent
      Dimensions:
        - Name: InstanceId
          Value: !Ref InstanceId
        - Name: path
          Value: /
        - Name: fstype
          Value: xfs
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:jupiter-alertas"]

  # Si el agente falla, api-usuario responde 503 y nginx lo registra: cubre también el chat caído.
  AlarmaWeb5xx:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jupiter-web-5xx
      AlarmDescription: La web devuelve 5 o más errores 5xx en 5 minutos (API, agente o proxy rotos)
      Namespace: Jupiter
      MetricName: Peticiones5xx
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:jupiter-alertas"]

  # Métricas de toda la cuenta, sin dimensión de modelo: también las evaluaciones del equipo.
  # FILL: Bedrock solo publica estas métricas cuando hay errores.
  AlarmaBedrockErrores:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jupiter-bedrock-errores
      AlarmDescription: Bedrock rechaza o limita 3 o más llamadas en 15 minutos (modelo retirado, cuota o permisos)
      Metrics:
        - Id: errores
          Expression: FILL(cliente, 0) + FILL(limitadas, 0)
          Label: Errores de cliente y llamadas limitadas
        - Id: cliente
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Bedrock
              MetricName: InvocationClientErrors
            Stat: Sum
            Period: 900
        - Id: limitadas
          ReturnData: false
          MetricStat:
            Metric:
              Namespace: AWS/Bedrock
              MetricName: InvocationThrottles
            Stat: Sum
            Period: 900
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:jupiter-alertas"]

  AlarmaBedrockTokensDia:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jupiter-bedrock-tokens-dia
      AlarmDescription: !Sub Más de ${UmbralTokensDia} tokens de entrada de Bedrock en 24 h (freno de coste)
      Namespace: AWS/Bedrock
      MetricName: InputTokenCount
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: !Ref UmbralTokensDia
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:jupiter-alertas"]

  # Cierra el fallo silencioso del pipeline: si la API de Madrid no devuelve registros, la Lambda
  # termina sin excepción (jupiter-pipeline-errores no salta) y publica HorasNuevas = 0.
  # breaching, al revés que las demás: si la Lambda no llega a publicar (no se ejecuta o falla
  # antes del final) tampoco hay datos nuevos, y eso sí es un fallo.
  AlarmaPipelineSinDatos:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jupiter-pipeline-sin-datos
      AlarmDescription: El pipeline no ha cargado ninguna hora nueva en 24 h (API de Madrid sin datos o Lambda sin ejecutar o fallida)
      Namespace: Jupiter/Pipeline
      MetricName: HorasNuevas
      Statistic: Sum
      Period: 86400
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:jupiter-alertas"]

  # La RDS tiene autoescalado de almacenamiento: por debajo del 10 % libre crece el disco (y el
  # coste) en lugar de llenarse.
  AlarmaRdsEspacio:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: jupiter-rds-espacio
      AlarmDescription: Quedan menos de 2 GB libres en la RDS (la carga nocturna llena el disco)
      Namespace: AWS/RDS
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DBInstanceIdentifier
          Value: jupiter-postgres
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 2147483648   # 2 GiB en bytes
      ComparisonOperator: LessThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Sub "arn:aws:sns:${AWS::Region}:${AWS::AccountId}:jupiter-alertas"]

  # --- Panel ---------------------------------------------------------------------------------
  # Cinco filas: Bedrock, borde HTTP, máquina, datos y negocio. El detalle de cada pregunta está
  # en Phoenix. Por modelo con SEARCH: un modelo nuevo aparece sin tocar la plantilla.
  Panel:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: jupiter
      DashboardBody: !Sub |
        {
          "start": "-PT24H",
          "widgets": [
            {
              "type": "text", "x": 0, "y": 0, "width": 24, "height": 2,
              "properties": {
                "markdown": "## Jupiter: calidad del aire de Madrid\nBedrock, borde HTTP (log de acceso de nginx), máquina, datos y negocio (lo que carga cada noche el pipeline y cuántas preguntas recibe el asistente). El detalle de cada pregunta al asistente está en **Phoenix**: `http://<IP de la EC2>/phoenix/` (la IP cambia en cada encendido). Logs en el grupo `${LogsEc2}`."
              }
            },
            {
              "type": "metric", "x": 0, "y": 2, "width": 6, "height": 6,
              "properties": {
                "title": "Bedrock: invocaciones por modelo", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [ [ { "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"Invocations\"', 'Sum', 300)", "id": "e1" } ] ]
              }
            },
            {
              "type": "metric", "x": 6, "y": 2, "width": 6, "height": 6,
              "properties": {
                "title": "Bedrock: latencia media por modelo (ms)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 300,
                "metrics": [ [ { "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InvocationLatency\"', 'Average', 300)", "id": "e1" } ] ]
              }
            },
            {
              "type": "metric", "x": 12, "y": 2, "width": 6, "height": 6,
              "properties": {
                "title": "Bedrock: tokens por modelo", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 3600,
                "metrics": [
                  [ { "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"InputTokenCount\"', 'Sum', 3600)", "id": "e1", "label": "Entrada" } ],
                  [ { "expression": "SEARCH('{AWS/Bedrock,ModelId} MetricName=\"OutputTokenCount\"', 'Sum', 3600)", "id": "e2", "label": "Salida" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 18, "y": 2, "width": 6, "height": 6,
              "properties": {
                "title": "Bedrock: errores (toda la cuenta)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "AWS/Bedrock", "InvocationClientErrors", { "label": "De cliente" } ],
                  [ ".", "InvocationServerErrors", { "label": "De servidor" } ],
                  [ ".", "InvocationThrottles", { "label": "Limitadas" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "Web: errores (4xx sin 401)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Sum", "period": 300,
                "metrics": [
                  [ "Jupiter", "Peticiones5xx", { "label": "5xx", "color": "#d62728" } ],
                  [ ".", "Peticiones4xx", { "label": "4xx", "color": "#ff7f0e" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "Web: tiempo de respuesta de /api/chat (s)", "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  [ "Jupiter", "TiempoRespuestaChat", { "stat": "Average", "label": "Media" } ],
                  [ "...", { "stat": "p90", "label": "P90" } ],
                  [ "...", { "stat": "SampleCount", "label": "Preguntas", "yAxis": "right" } ]
                ]
              }
            },
            {
              "type": "alarm", "x": 16, "y": 8, "width": 8, "height": 6,
              "properties": {
                "title": "Alarmas",
                "alarms": [
                  "${AlarmaWeb5xx.Arn}",
                  "${AlarmaBedrockErrores.Arn}",
                  "${AlarmaBedrockTokensDia.Arn}",
                  "${AlarmaEc2Estado.Arn}",
                  "${AlarmaEc2CreditosCpu.Arn}",
                  "${AlarmaEc2Memoria.Arn}",
                  "${AlarmaEc2Disco.Arn}",
                  "${AlarmaRdsEspacio.Arn}",
                  "${AlarmaPipelineSinDatos.Arn}",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:jupiter-pipeline-errores",
                  "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:alarm:jupiter-pipeline-sin-ejecuciones"
                ]
              }
            },
            {
              "type": "metric", "x": 0, "y": 14, "width": 6, "height": 6,
              "properties": {
                "title": "EC2: CPU (%)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 300,
                "metrics": [ [ "AWS/EC2", "CPUUtilization", "InstanceId", "${InstanceId}", { "label": "CPU" } ] ],
                "yAxis": { "left": { "min": 0, "max": 100 } }
              }
            },
            {
              "type": "metric", "x": 6, "y": 14, "width": 6, "height": 6,
              "properties": {
                "title": "EC2: créditos de CPU", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Minimum", "period": 300,
                "metrics": [ [ "AWS/EC2", "CPUCreditBalance", "InstanceId", "${InstanceId}", { "label": "Saldo" } ] ],
                "annotations": { "horizontal": [ { "value": 20, "label": "Alarma" } ] }
              }
            },
            {
              "type": "metric", "x": 12, "y": 14, "width": 6, "height": 6,
              "properties": {
                "title": "EC2: memoria (%)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 300,
                "metrics": [ [ "CWAgent", "mem_used_percent", "InstanceId", "${InstanceId}", { "label": "Memoria" } ] ],
                "yAxis": { "left": { "min": 0, "max": 100 } },
                "annotations": { "horizontal": [ { "value": 90, "label": "Alarma" } ] }
              }
            },
            {
              "type": "metric", "x": 18, "y": 14, "width": 6, "height": 6,
              "properties": {
                "title": "EC2: disco / (%)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 300,
                "metrics": [ [ "CWAgent", "disk_used_percent", "InstanceId", "${InstanceId}", "path", "/", "fstype", "xfs", { "label": "Disco" } ] ],
                "yAxis": { "left": { "min": 0, "max": 100 } },
                "annotations": { "horizontal": [ { "value": 85, "label": "Alarma" } ] }
              }
            },
            {
              "type": "metric", "x": 0, "y": 20, "width": 8, "height": 6,
              "properties": {
                "title": "Lambda jupiter-pipeline: ejecuciones y errores", "region": "${AWS::Region}", "view": "bar", "stat": "Sum", "period": 86400,
                "metrics": [
                  [ "AWS/Lambda", "Invocations", "FunctionName", "jupiter-pipeline", { "label": "Ejecuciones" } ],
                  [ ".", "Errors", ".", ".", { "label": "Errores", "color": "#d62728" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 8, "y": 20, "width": 8, "height": 6,
              "properties": {
                "title": "RDS: CPU (%) y conexiones", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 300,
                "metrics": [
                  [ "AWS/RDS", "CPUUtilization", "DBInstanceIdentifier", "jupiter-postgres", { "label": "CPU" } ],
                  [ ".", "DatabaseConnections", ".", ".", { "label": "Conexiones", "yAxis": "right" } ]
                ]
              }
            },
            {
              "type": "metric", "x": 16, "y": 20, "width": 8, "height": 6,
              "properties": {
                "title": "RDS: espacio libre (GB)", "region": "${AWS::Region}", "view": "timeSeries", "period": 300,
                "metrics": [
                  [ { "expression": "libre / 1073741824", "label": "Libre (GB)", "id": "gb" } ],
                  [ "AWS/RDS", "FreeStorageSpace", "DBInstanceIdentifier", "jupiter-postgres", { "stat": "Minimum", "id": "libre", "visible": false } ]
                ],
                "annotations": { "horizontal": [ { "value": 2, "label": "Alarma" } ] }
              }
            },
            {
              "type": "text", "x": 0, "y": 26, "width": 24, "height": 1,
              "properties": {
                "markdown": "### Negocio: una ejecución del pipeline cada noche (23:45) y uso del asistente. Detalle de cada ejecución (validez, estaciones que faltan, anomalías por contaminante) en Logs Insights sobre `/aws/lambda/jupiter-pipeline`"
              }
            },
            {
              "type": "metric", "x": 0, "y": 27, "width": 6, "height": 6,
              "properties": {
                "title": "Pipeline: horas cargadas por noche", "region": "${AWS::Region}", "view": "bar", "stat": "Sum", "period": 86400,
                "metrics": [ [ "Jupiter/Pipeline", "HorasNuevas", { "label": "Filas horarias nuevas o corregidas" } ] ]
              }
            },
            {
              "type": "metric", "x": 6, "y": 27, "width": 6, "height": 6,
              "properties": {
                "title": "Pipeline: estaciones con datos (de 24)", "region": "${AWS::Region}", "view": "gauge", "stat": "Minimum", "period": 86400,
                "metrics": [ [ "Jupiter/Pipeline", "EstacionesConDatos", { "label": "Última noche" } ] ],
                "yAxis": { "left": { "min": 0, "max": 24 } },
                "annotations": { "horizontal": [ { "value": 20, "label": "Faltan 5 o más", "color": "#d62728", "fill": "below" } ] }
              }
            },
            {
              "type": "metric", "x": 12, "y": 27, "width": 6, "height": 6,
              "properties": {
                "title": "Pipeline: bloques anómalos (%)", "region": "${AWS::Region}", "view": "timeSeries", "stat": "Average", "period": 86400,
                "metrics": [ [ "Jupiter/Pipeline", "TasaAnomalias", { "label": "Tasa de anomalías" } ] ],
                "yAxis": { "left": { "min": 0 } },
                "annotations": { "horizontal": [ { "value": 1, "label": "Esperado por el modelo (contamination = 1 %)" } ] }
              }
            },
            {
              "type": "metric", "x": 18, "y": 27, "width": 6, "height": 6,
              "properties": {
                "title": "Asistente: preguntas respondidas hoy (UTC)", "region": "${AWS::Region}", "view": "singleValue", "stat": "SampleCount", "period": 86400,
                "metrics": [ [ "Jupiter", "TiempoRespuestaChat", { "label": "Preguntas" } ] ]
              }
            }
          ]
        }

Outputs:
  GrupoLogs:
    Value: !Ref LogsEc2
  Panel:
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards/dashboard/jupiter
